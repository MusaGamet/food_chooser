<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="images/logo.png" alt="Логотип"></a>
        </div>
        <div class="header-info">
            <!-- <span class="name">Котенок</span> -->
            <span class="balance">Баланс: <span id="money">100</span> ₽</span>
            <a id="auth-link" href="login.html">Войти</a>
            <!-- theme switcher removed -->
            <span id="user-avatar" class="user-avatar" style="display:none"></span>
        </div>
    </header>
<!-- Toast notifications -->
<div id="toast-container"></div>

    <main class="cart-page">
        <h2>Корзина</h2>
        <table id="cart-table" class="cart-table" style="width:100%;margin-bottom:18px;">
            <thead>
                <tr><th>Блюдо</th><th>Цена</th><th></th></tr>
            </thead>
            <tbody id="cart-items"></tbody>
        </table>
        <p style="font-size:18px;font-weight:500;">Общая стоимость: <span id="total-cost">0</span> ₽</p>
        <div class="cart-actions">
            <button id="place-order-btn" onclick="placeOrder()">Оформить заказ</button>
            <button id="clear-cart" onclick="clearCart()">Очистить корзину</button>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>

<!-- Модальное окно -->
<div id="modal-overlay" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.25);z-index:2000;justify-content:center;align-items:center;">
    <div id="modal-window" style="background:#fff;padding:24px 20px;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.18);min-width:280px;max-width:90vw;">
        <div id="modal-message" style="margin-bottom:18px;font-size:17px;color:#333;"></div>
        <div id="modal-actions" style="display:flex;gap:12px;justify-content:flex-end;"></div>
    </div>
</div>
</body>
</html>
