<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="login-page">
        <h2 class="login-title">Авторизация</h2>
        <form id="login-form">
            <label>
                Логин:
                <input type="text" id="username" required autocomplete="username" style="transition:box-shadow 0.18s;">
            </label>
            <label>
                Пароль:
                <input type="password" id="password" required autocomplete="current-password" style="transition:box-shadow 0.18s;">
            </label>
            <div class="login-error" id="login-error" aria-live="polite"></div>
            <button type="submit" id="login-submit">Войти</button>
        </form>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
